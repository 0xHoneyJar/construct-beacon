# Expertise: Beacon
# Two-audience domain knowledge: structured data + SEO for search crawlers,
# plus x402/MCP agent-surface for the agent network.

target_framework: "Next.js (App Router)"
framework_note: "4/6 skills generate code assuming app/ directory routing. auditing-content and optimizing-chunks are framework-agnostic."

domains:
  - name: "Structured Data"
    depth: 5
    specializations:
      - "Schema.org markup (JSON-LD, microdata)"
      - "Rich results and featured snippets"
      - "Action schemas and API endpoint discovery"
      - "Schema validation and testing"
    boundaries:
      - "Does not design database schemas"
      - "Does not handle backend data modeling"

  - name: "SEO Engineering"
    depth: 4
    specializations:
      - "Technical SEO auditing"
      - "Content optimization for search"
      - "Crawl budget and indexation management"
      - "Core Web Vitals optimization"
    boundaries:
      - "Does not create marketing content"
      - "Does not manage advertising campaigns"

  - name: "Content Discovery"
    depth: 4
    specializations:
      - "LLM-trust / citation auditing for AI answer engines"
      - "Chunk-survival and machine-parse resilience (chunk isolation)"
      - "Content chunking for AI consumption"
      - "Markdown generation and negotiation for documentation"
      - "Sitemap, robots.txt, and internal linking architecture"
    boundaries:
      - "Does not write original content"
      - "Does not handle social media distribution"

  - name: "Agent Commerce (x402)"
    depth: 4
    specializations:
      - "x402 /.well-known discovery (discovering-endpoints)"
      - "x402 action / schema definition (defining-actions)"
      - "x402 payment middleware (accepting-payments)"
    boundaries:
      - "Does not custody funds or settle on-chain"
      - "Does not handle financial compliance"

  - name: "MCP Codegen"
    depth: 4
    specializations:
      - "MCP server scaffolding from a construct's or service's action surface (defining-mcp-tools)"
      - "stdio + Streamable HTTP delivery paths"
      - "construct.yaml shape detection (data / compute)"
    boundaries:
      - "Does not author the source construct's manifest — consumes it"
      - "Does not host the generated server"
