schema_version: 3
name: Beacon
slug: beacon
version: 2.1.0
description: "Make your content readable by AI agents and your APIs easy to discover. Score content for AI readability, export clean markdown, split content into structured sections, generate API specifications, and ship MCP servers from any construct or service."
short_description: "AI content indexing + API discovery + MCP codegen"
domain:
  - operations
author: 0xHoneyJar
license: MIT
visibility: public
skills:
  - slug: auditing-content
    path: skills/auditing-content
  - slug: generating-markdown
    path: skills/generating-markdown
  - slug: optimizing-chunks
    path: skills/optimizing-chunks
  - slug: discovering-endpoints
    path: skills/discovering-endpoints
  - slug: defining-actions
    path: skills/defining-actions
  - slug: defining-mcp-tools
    path: skills/defining-mcp-tools
  - slug: accepting-payments
    path: skills/accepting-payments
repository:
  url: https://github.com/0xHoneyJar/construct-beacon.git
  homepage: https://constructs.network/constructs/beacon
events:
  emits:
    - type: forge.beacon.audit_completed
      description: Emitted when an LLM trust audit completes for a page or full site
      data_schema:
        page_slug: string
        score: number
        risk_level: string
    - type: forge.beacon.chunks_optimized
      description: Emitted when chunk optimization recommendations are generated
      data_schema:
        page_slug: string
        findings_count: number
    - type: forge.beacon.markdown_generated
      description: Emitted when markdown export capability is added to a page
      data_schema:
        page_path: string
        mode: string
    - type: forge.beacon.actions_defined
      description: Emitted when JSON Schema and OpenAPI specs are generated for endpoints
      data_schema:
        endpoints_count: number
        openapi_path: string
    - type: forge.beacon.discovery_generated
      description: Emitted when a /.well-known/x402 discovery endpoint is generated
      data_schema:
        endpoint_path: string
        service_name: string
    - type: forge.beacon.middleware_generated
      description: Emitted when x402 payment middleware is generated for an endpoint
      data_schema:
        endpoint_path: string
        pricing: object
    - type: forge.beacon.mcp_generated
      description: Emitted when an MCP server is scaffolded from a construct's or service's action surface
      data_schema:
        shape: string
        paths: array
        tools_count: number
        source_actions: number
  consumes: []
composition_paths:
  writes:
    - "grimoires/beacon/"
capabilities:
  model_tier: sonnet
  danger_level: moderate
  effort_hint: medium
  downgrade_allowed: true
  execution_hint: parallel
  requires:
    tool_calling: true
    thinking_traces: false
    vision: false
identity:
  persona: identity/persona.yaml
  expertise: identity/expertise.yaml
hooks:
  post_install: scripts/install.sh
quick_start:
  command: /audit-llm
  description: check your site's LLM readiness
